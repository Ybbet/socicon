name: Build production release assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to package
        required: true
        type: string

  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build-release:
    name: Build and upload production package
    runs-on: ubuntu-latest

    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Check out the released version
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate and validate assets
        run: npm run build

      - name: Build production archives
        run: |
          npm run release:build -- \
            "${{ env.RELEASE_TAG }}"

      - name: Display archive contents
        shell: bash
        run: |
          tag="${{ env.RELEASE_TAG }}"
          version="${tag#v}"
          package="socicon-${version}"

          echo "ZIP archive contents:"
          unzip -l "release/${package}.zip"

          echo
          echo "tar.gz archive contents:"
          tar \
            --list \
            --gzip \
            --file="release/${package}.tar.gz"

      - name: Upload production archives
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ env.RELEASE_TAG }}"
          version="${tag#v}"
          package="socicon-${version}"

          gh release upload "$tag" \
            "release/${package}.zip#Socicon production package (ZIP)" \
            "release/${package}.tar.gz#Socicon production package (tar.gz)" \
            --clobber

      - name: Upload workflow artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: socicon-production-${{ env.RELEASE_TAG }}
          path: |
            release/*.zip
            release/*.tar.gz
