name: Generate Socicon assets

on:
  workflow_dispatch:

  pull_request:
    paths:
      - "selection.json"
      - "icons-metadata.json"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/generate-assets.yml"
      - ".github/workflows/release-assets.yml"

  push:
    branches:
      - develop
    paths:
      - "selection.json"
      - "icons-metadata.json"
      - "metadata-rules.json"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/generate-assets.yml"
      - ".github/workflows/release-assets.yml"

permissions:
  contents: write

jobs:
  generate:
    name: Generate and validate assets
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate and validate assets
        run: npm run build

      - name: Verify generated files in pull requests
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          if ! git diff --exit-code -- \
            chart-list.json \
            chart-list.js \
            svg/ \
            site/data/; then
            echo
            echo "::error::Generated assets are not up to date."
            echo "Run the following commands locally:"
            echo "  npm ci"
            echo "  npm run build"
            exit 1
          fi

      - name: Commit generated files
        if: >
          github.event_name == 'push' &&
          github.ref == 'refs/heads/develop'
        shell: bash
        run: |
          if git diff --quiet -- \
            chart-list.json \
            chart-list.js \
            svg/ \
            site/data/; then
            echo "Generated assets are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            chart-list.json \
            chart-list.js \
            svg/ \
            site/data/

          git commit -m "Build: Regenerate catalogs and SVG icons"
          git push